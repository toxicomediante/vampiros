name: Deploy Vampiros to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply pending combat fixes
        run: |
          if [ -f tools/apply_combat_fixes.py ]; then
            python3 tools/apply_combat_fixes.py
          fi

      - name: Store corrected assets in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/enemies/tarantula.png \
                  assets/enemies/vampiro_malleiro.png \
                  assets/ui/combat/hp_def_frame.png \
                  scripts/combat.gd
          if ! git diff --cached --quiet; then
            git commit -m 'Fix combat transparency UI card fan and mobile controls [skip ci]'
            git push origin HEAD:main
          fi

      - name: Install Godot 4.7.1
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q Godot_v4.7.1-stable_export_templates.tpz
          cp -R templates/* "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Export web build
        run: |
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --import
          godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
