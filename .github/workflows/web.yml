name: Deploy Web Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    name: Build Godot Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Validate PNG assets
        id: validate_pngs
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 tools/validate_pngs.py 2>&1 | tee png-validation.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload PNG validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-validation-log
          path: png-validation.log
          if-no-files-found: error

      - name: Stop after failed PNG validation
        if: steps.validate_pngs.outputs.exit_code != '0'
        run: exit 1

      - name: Generate original background music
        shell: bash
        run: |
          python3 tools/generate_night_drive.py
          test -s assets/audio/neon_blood_drive.wav

      - name: Import project
        run: godot --headless --editor --path . --import --quit

      - name: Validate project
        run: godot --headless --editor --path . --quit-after 2

      - name: Export web build
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          cp assets/social/vampiros_social_preview_v2.png build/web/vampiros_social_preview_v2.png
          test -s build/web/vampiros_social_preview_v2.png
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
