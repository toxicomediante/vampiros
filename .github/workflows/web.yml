name: Deploy Web Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    name: Build Godot Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Apply deterministic combat UI and drag fix
        run: python3 tools/direct_combat_fix.py

      - name: Generate background music
        run: |
          python3 tools/generate_night_drive.py
          test -s assets/audio/neon_blood_drive.wav

      - name: Import, validate and run combat scene
        run: |
          godot --headless --editor --path . --import --quit
          godot --headless --editor --path . --quit-after 2
          godot --headless --path . scenes/combat.tscn --quit-after 3

      - name: Export web build
        run: |
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release 'Web' build/web/index.html
          test -s build/web/index.html
          cp assets/social/vampiros_social_preview_v2.png build/web/vampiros_social_preview_v2.png
          touch build/web/.nojekyll

      - name: Version web payloads to defeat stale cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path('build/web')
          base = 'vampiros-' + os.environ['GITHUB_SHA'][:12]
          html_path = root / 'index.html'
          html = html_path.read_text(encoding='utf-8')

          suffixes = ['.js', '.wasm', '.pck', '.worker.js', '.audio.worklet.js']
          for suffix in suffixes:
              source = root / ('index' + suffix)
              if source.exists():
                  source.rename(root / (base + suffix))

          html = html.replace('index.js', base + '.js')
          html = html.replace('"executable":"index"', f'"executable":"{base}"')
          html = html.replace('"executable": "index"', f'"executable": "{base}"')
          html_path.write_text(html, encoding='utf-8')

          assert (root / (base + '.pck')).is_file()
          assert (root / (base + '.wasm')).is_file()
          assert base in html_path.read_text(encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout main for deployment marker
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record successful deployment
        if: github.event_name != 'pull_request'
        run: |
          printf '%s\n%s\n' "$GITHUB_SHA" "${{ steps.deployment.outputs.page_url }}" > .github/last-successful-pages-deploy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-successful-pages-deploy
          git commit -m 'Record successful Pages deployment [skip ci]' || exit 0
          git push origin HEAD:main
