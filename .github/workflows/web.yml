name: Diagnose Combat

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --path . --import --quit

      - name: Run combat scene
        run: godot --headless --path . scenes/combat.tscn --quit-after 5
