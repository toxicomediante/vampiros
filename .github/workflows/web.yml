name: Validate and deploy Web

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1
  MAX_WEB_PCK_BYTES: 36700160

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate committed project
        run: |
          python3 tools/validate_project.py
          python3 tools/test_version_web_export.py

      - name: Configure Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import in Godot
        shell: bash
        run: |
          set -o pipefail
          timeout 5m godot --headless --editor --path . --import --quit 2>&1 \
            | tee godot-import.log
          python3 tools/validate_project.py --godot-log godot-import.log

      - name: Run scenes in Godot
        shell: bash
        run: |
          set -o pipefail
          : > godot-runtime.log
          for scene in main overworld combat_loader; do
            timeout 2m godot --headless --path . \
              --scene "res://scenes/${scene}.tscn" \
              --fixed-fps 60 \
              --quit-after 180 2>&1 \
              | tee -a godot-runtime.log
          done
          timeout 2m godot --headless --path . \
            --script tools/combat_smoke_test.gd \
            --fixed-fps 60 2>&1 \
            | tee -a godot-runtime.log
          timeout 2m godot --headless --path . \
            --script tools/scene_lifecycle_test.gd \
            --fixed-fps 60 2>&1 \
            | tee -a godot-runtime.log
          python3 tools/validate_project.py \
            --godot-log godot-import.log \
            --godot-log godot-runtime.log

      - name: Export Web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          timeout 10m godot --headless --path . \
            --export-release "Web" build/web/index.html 2>&1 \
            | tee godot-export.log
          python3 tools/validate_project.py \
            --godot-log godot-import.log \
            --godot-log godot-export.log
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
          pck_bytes=$(stat --format=%s build/web/index.pck)
          if (( pck_bytes > MAX_WEB_PCK_BYTES )); then
            echo "Web PCK demasiado grande para móviles: ${pck_bytes} bytes"
            exit 1
          fi
          python3 tools/version_web_export.py build/web "$GITHUB_SHA"
          versioned_prefix="build/web/index-${GITHUB_SHA}"
          test -s "${versioned_prefix}.js"
          test -s "${versioned_prefix}.pck"
          test -s "${versioned_prefix}.wasm"
          test ! -e build/web/index.js
          test ! -e build/web/index.pck
          test ! -e build/web/index.wasm
          cp assets/social/vampiros_social_preview_v2.png \
            build/web/vampiros_social_preview_v2.png
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  android_apk:
    if: github.event_name == 'pull_request'
    name: Export debug APK from current main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate committed project
        run: python3 tools/validate_project.py

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import in Godot
        shell: bash
        run: |
          set -o pipefail
          timeout 5m godot --headless --editor --path . --import --quit 2>&1 \
            | tee godot-import.log
          python3 tools/validate_project.py --godot-log godot-import.log

      - name: Export APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          timeout 15m godot --headless --path . \
            --export-debug "Android Debug" build/vampiros-debug.apk 2>&1 \
            | tee godot-export.log
          python3 tools/validate_project.py \
            --godot-log godot-import.log \
            --godot-log godot-export.log

      - name: Verify APK
        shell: bash
        run: |
          test -s build/vampiros-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" \
            dump badging build/vampiros-debug.apk
          sha256sum build/vampiros-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vampiros-android-debug-main-545976f
          path: build/vampiros-debug.apk
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
