name: Deploy Web Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1

jobs:
  restore_assets:
    name: Restore vertical slice PNG assets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download recovery package
        shell: bash
        run: |
          set -euxo pipefail
          # Recovery package contains complete PNG binaries, avoiding Contents API truncation.
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=18NOC_EAUXNsmi4GLsvzEAvfQleLtgfss&export=download&confirm=t' \
            -o /tmp/vertical_slice_assets_rebuilt.zip
          test -s /tmp/vertical_slice_assets_rebuilt.zip
          unzip -t /tmp/vertical_slice_assets_rebuilt.zip

      - name: Restore complete PNG binaries
        shell: bash
        run: |
          set -euxo pipefail
          unzip -o /tmp/vertical_slice_assets_rebuilt.zip -d .
          python3 tools/validate_pngs.py

      - name: Commit restored assets to main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cards assets/enemies assets/ui/combat/hp_def_frame.png
          if git diff --cached --quiet; then
            echo 'No asset changes detected.'
            exit 0
          fi
          git commit -m 'Restore complete vertical slice PNG assets'
          git push origin HEAD:main

  build:
    name: Build Godot Web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Validate PNG assets
        run: python3 tools/validate_pngs.py

      - name: Generate original background music
        shell: bash
        run: |
          python3 tools/generate_night_drive.py
          test -s assets/audio/neon_blood_drive.wav

      - name: Import project
        run: godot --headless --editor --path . --import --quit

      - name: Validate project
        run: godot --headless --editor --path . --quit-after 2

      - name: Export web build
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release 'Web' build/web/index.html
          test -s build/web/index.html
          cp assets/social/vampiros_social_preview_v2.png build/web/vampiros_social_preview_v2.png
          test -s build/web/vampiros_social_preview_v2.png
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
