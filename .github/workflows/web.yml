name: Validate and deploy Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate committed project
        run: python3 tools/validate_project.py

      - name: Configure Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import in Godot
        shell: bash
        run: |
          set -o pipefail
          timeout 5m godot --headless --editor --path . --import --quit 2>&1 \
            | tee godot-import.log
          python3 tools/validate_project.py --godot-log godot-import.log

      - name: Export Web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          timeout 10m godot --headless --path . \
            --export-release "Web" build/web/index.html 2>&1 \
            | tee godot-export.log
          python3 tools/validate_project.py \
            --godot-log godot-import.log \
            --godot-log godot-export.log
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
          cp assets/social/vampiros_social_preview_v2.png \
            build/web/vampiros_social_preview_v2.png
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
