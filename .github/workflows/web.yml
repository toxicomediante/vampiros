name: Validate and deploy Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1
  MAX_WEB_PCK_BYTES: 134217728

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate committed project
        run: |
          python3 tools/validate_project.py
          python3 tools/test_version_web_export.py

      - name: Configure Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import in Godot
        shell: bash
        run: |
          set -o pipefail
          timeout 5m godot --headless --editor --path . --import --quit 2>&1 \
            | tee godot-import.log
          python3 tools/validate_project.py --godot-log godot-import.log

      - name: Run scenes in Godot
        shell: bash
        run: |
          set -o pipefail
          : > godot-runtime.log
          for scene in main overworld combat_loader shop coming_soon; do
            timeout 2m godot --headless --path . \
              --scene "res://scenes/${scene}.tscn" \
              --fixed-fps 60 \
              --quit-after 180 2>&1 \
              | tee -a godot-runtime.log
          done
          timeout 2m godot --headless --path . \
            --script tools/combat_smoke_test.gd \
            --fixed-fps 60 2>&1 \
            | tee -a godot-runtime.log
          timeout 2m godot --headless --path . \
            --script tools/scene_lifecycle_test.gd \
            --fixed-fps 60 2>&1 \
            | tee -a godot-runtime.log
          timeout 4m godot --headless --path . \
            --script tools/progression_smoke_test.gd \
            --fixed-fps 60 2>&1 \
            | tee -a godot-runtime.log
          python3 tools/validate_project.py \
            --godot-log godot-import.log \
            --godot-log godot-runtime.log

      - name: Export Web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          timeout 10m godot --headless --path . \
            --export-release "Web" build/web/index.html 2>&1 \
            | tee godot-export.log
          python3 tools/validate_project.py \
            --godot-log godot-import.log \
            --godot-log godot-export.log
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
          pck_bytes=$(stat --format=%s build/web/index.pck)
          if (( pck_bytes > MAX_WEB_PCK_BYTES )); then
            echo "Web PCK demasiado grande para móviles: ${pck_bytes} bytes"
            exit 1
          fi
          python3 tools/version_web_export.py build/web "$GITHUB_SHA"
          versioned_prefix="build/web/index-${GITHUB_SHA}"
          test -s "${versioned_prefix}.js"
          test -s "${versioned_prefix}.pck"
          test -s "${versioned_prefix}.wasm"
          test ! -e build/web/index.js
          test ! -e build/web/index.pck
          test ! -e build/web/index.wasm
          cp tools/retire_legacy_service_worker.js \
            build/web/index.service.worker.js
          test -s build/web/index.service.worker.js
          cp assets/social/vampiros_social_preview_v2.png \
            build/web/vampiros_social_preview_v2.png
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
