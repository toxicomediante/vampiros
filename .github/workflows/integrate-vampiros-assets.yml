name: Integrate Vampiros assets

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/integrate-vampiros-assets.yml'
      - 'scripts/combat_ui_runtime.gd'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download approved visual assets
        run: |
          python -m pip install --quiet gdown
          mkdir -p assets/overworld assets/ui/combat/status
          gdown --fuzzy 'https://drive.google.com/file/d/1JZ0Eo5Rk2CfcQFCQGLZJDJwOQWG6AN7c/view' -O assets/overworld/overworld_map_top.png
          gdown --fuzzy 'https://drive.google.com/file/d/1V1Bk-uAklsqKpqyd5rS3kKO3bHPFCarU/view' -O assets/overworld/overworld_map_bottom.png
          gdown --fuzzy 'https://drive.google.com/file/d/1d8mkXuKnp_AgOD0x8Te1fX7qTynBM68Y/view' -O assets/ui/combat/hp_def_frame.png
          gdown --fuzzy 'https://drive.google.com/file/d/1ih-zS5VzVAPLqxg3tALAp1FyhE9UygOb/view' -O assets/ui/combat/status/status_atlas.png
          test -s assets/overworld/overworld_map_top.png
          test -s assets/overworld/overworld_map_bottom.png
          test -s assets/ui/combat/hp_def_frame.png
          test -s assets/ui/combat/status/status_atlas.png

      - name: Enable combat UI runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('project.godot')
          text = path.read_text()
          anchor = 'GameState="*res://scripts/game_state.gd"'
          line = 'CombatUIRuntime="*res://scripts/combat_ui_runtime.gd"'
          if line not in text:
              text = text.replace(anchor, anchor + '\n' + line)
          path.write_text(text)
          PY

      - name: Commit assets to integration branch
        run: |
          git config user.name 'Vampiros Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/overworld assets/ui/combat scripts/combat_ui_runtime.gd project.godot
          git commit -m 'Integrate status icons, compact HUD, and corrected overworld' || exit 0
          git push origin HEAD:${{ github.head_ref }}
