name: Repair PNG CRCs

on:
  push:
    branches:
      - main
    paths:
      - tools/repair_png_crcs.py
      - .github/workflows/repair-png-crcs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Repair and validate PNG files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair PNG chunk CRCs
        run: python3 tools/repair_png_crcs.py assets

      - name: Validate repaired PNG assets
        run: python3 tools/validate_pngs.py

      - name: Commit repaired binaries
        shell: bash
        run: |
          if git diff --quiet -- assets; then
            echo "No PNG repairs were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Repair PNG chunk CRCs [skip crc repair]"
          git push origin HEAD:main
